<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in · PasteBoard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../assets/shared/icons/icon-32.png">
  <link rel="stylesheet" href="../assets/shared/ui/pd.css">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body class="pd">
  <main class="auth">
    <div class="auth__card">
      <a href="../landing/index.html" class="brand"><img src="../assets/shared/icons/icon-48.png" alt="" width="26" height="26" style="border-radius:7px">PasteBoard</a>

      <section id="view-login">
        <h1>Log in to PasteBoard</h1>
        <p class="auth__sub">Manage your account, team and devices. The extension itself stays simple.</p>
        <!-- Social login intentionally left out for now (Supabase auth + Google OAuth to follow once API keys
             are in place). Email + password below hits the Netlify function backend directly. -->
        <form id="login-form" novalidate>
          <div class="pd-field"><label class="pd-label" for="email">Email</label><input class="pd-input" id="email" type="email" autocomplete="email" placeholder="you@company.com" required></div>
          <div class="pd-field"><label class="pd-label" for="password">Password</label>
            <div class="pd-pw-wrap"><input class="pd-input" id="password" type="password" autocomplete="current-password" required><button class="pd-pw-toggle" type="button" data-pw-toggle="password">Show</button></div>
          </div>
          <button class="pd-btn pd-btn--primary pd-btn--lg pd-btn--block" id="submit" type="submit">Log in</button>
          <p class="pd-help" id="err" style="color:var(--pd-danger)" role="alert"></p>
        </form>
        <p class="auth__foot">No account yet? <a href="../signup/index.html">Create one</a> &middot; Joining a team? <a href="../signup/index.html?mode=join">Request access</a></p>
      </section>

      <section id="view-done" hidden>
        <h1>You are logged in</h1>
        <p class="auth__sub" id="done-msg"></p>
        <a class="pd-btn pd-btn--primary pd-btn--lg pd-btn--block" id="go" href="../dashboard/index.html">Open dashboard</a>
        <p class="auth__foot" id="ext-note" hidden>You came from the extension. You can close this tab and return to Chrome.</p>
        <button class="pd-btn pd-btn--ghost pd-btn--block" id="switch" style="margin-top:8px">Log in as someone else</button>
      </section>
    </div>
  </main>
  <script src="../assets/api.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const next = '../dashboard/index.html';
      const show = (id) => ['view-login', 'view-done'].forEach((v) => ($(v).hidden = v !== id));

      const existing = PBApi.session();
      if (existing && params.get('switch') !== '1') done(existing);
      function done(s) {
        $('done-msg').textContent = 'Signed in as ' + (s.name || s.accountEmail) + (s.role === 'owner' ? ' (account owner)' : '');
        $('go').href = next;
        $('ext-note').hidden = params.get('source') !== 'extension';
        show('view-done');
      }
      $('login-form').onsubmit = async (e) => {
        e.preventDefault(); $('err').textContent = ''; $('submit').disabled = true;
        try { const data = await PBApi.login({ email: $('email').value.trim(), password: $('password').value }); PBApi.setSession(data); done(data); }
        catch (err) { $('err').textContent = err.message; } finally { $('submit').disabled = false; }
      };
      $('switch').onclick = () => { PBApi.signOut(); location.href = 'index.html?switch=1'; };
      document.querySelectorAll('[data-pw-toggle]').forEach((btn) => {
        btn.onclick = () => { const input = $(btn.dataset.pwToggle); const show = input.type === 'password'; input.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show'; };
      });
    })();
  </script>
</body>
</html>
