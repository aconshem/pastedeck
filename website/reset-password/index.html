<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose a new password · PasteBoard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../assets/shared/icons/icon-32.png">
  <link rel="stylesheet" href="../assets/shared/ui/pd.css">
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body class="pd">
  <main class="auth">
    <div class="auth__card">
      <a href="../landing/index.html" class="brand"><img src="../assets/shared/icons/icon-48.png" alt="" width="26" height="26" style="border-radius:7px">PasteBoard</a>
      <section id="view-form" hidden>
        <h1>Choose a new password</h1>
        <p class="auth__sub">Pick something at least 8 characters long. You&rsquo;ll be signed out everywhere and asked to log in again.</p>
        <form id="form" novalidate>
          <div class="pd-field"><label class="pd-label" for="pw">New password</label><div class="pd-pw-wrap"><input class="pd-input" id="pw" type="password" minlength="8" autocomplete="new-password" required><button class="pd-pw-toggle" type="button" data-pw-toggle="pw">Show</button></div></div>
          <div class="pd-field"><label class="pd-label" for="pw2">Confirm password</label><input class="pd-input" id="pw2" type="password" autocomplete="new-password" required></div>
          <button class="pd-btn pd-btn--primary pd-btn--lg pd-btn--block" id="submit" type="submit">Set new password</button>
          <p class="pd-help" id="err" style="color:var(--pd-danger)" role="alert"></p>
        </form>
      </section>
      <section id="view-bad" hidden>
        <h1>Link expired</h1>
        <p class="auth__sub">This reset link is invalid, already used, or expired.</p>
        <a class="pd-btn pd-btn--primary pd-btn--block" href="../forgot-password/index.html">Request a new link</a>
      </section>
    </div>
  </main>
  <footer class="footer"><div class="container"><span>&copy; PasteBoard</span><nav aria-label="Legal"><a href="../pricing/index.html">Pricing</a><a href="../landing/index.html#faq">FAQ</a><a href="../terms/index.html">Terms</a><a href="../privacy/index.html">Privacy</a><a href="../refunds/index.html">Refunds</a></nav></div></footer>
  <script src="../assets/api.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const token = new URLSearchParams(location.search).get('token');
      (async () => { let ok = false; try { ok = token && (await PBApi.resetCheck(token)).valid; } catch (e) {} $(ok ? 'view-form' : 'view-bad').hidden = false; })();
      $('form').onsubmit = async (e) => {
        e.preventDefault(); $('err').textContent = '';
        if ($('pw').value !== $('pw2').value) { $('err').textContent = 'The two passwords don’t match.'; return; }
        $('submit').disabled = true;
        try { await PBApi.reset(token, $('pw').value); PBApi.signOut(); location.href = '../login/index.html?reason=reset'; }
        catch (err) { $('err').textContent = err.message; } finally { $('submit').disabled = false; }
      };
      document.querySelectorAll("[data-pw-toggle]").forEach(function(b){b.onclick=function(){var i=document.getElementById(b.dataset.pwToggle),s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"Hide":"Show";};});
    })();
  </script>
</body>
</html>
